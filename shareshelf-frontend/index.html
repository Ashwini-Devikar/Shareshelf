<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShareShelf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme and style before the page paints, so there is no flash
      (function () {
        try {
          var saved = localStorage.getItem("shareshelf_theme");
          var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = saved === "light" || saved === "dark" ? saved : dark ? "dark" : "light";
          document.documentElement.setAttribute("data-bs-theme", theme);
          var arcade = localStorage.getItem("shareshelf_arcade") !== "off";
          document.documentElement.setAttribute("data-ss-style", arcade ? "arcade" : "classic");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
