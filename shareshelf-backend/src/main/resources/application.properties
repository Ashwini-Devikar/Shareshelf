spring.application.name=shareshelf-backend
server.port=${PORT:8080}

# ---- MySQL ----
# Local: the defaults below are used (put your real password in application-local.properties).
# Deployed: set DB_URL, DB_USERNAME and DB_PASSWORD as environment variables on your host.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shareshelf?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:YOUR_MYSQL_PASSWORD}

# Hibernate creates/updates the tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# ---- JWT ----
# Must be at least 32 characters. ALWAYS set JWT_SECRET when deploying.
app.jwt.secret=${JWT_SECRET:shareshelf-super-secret-key-change-this-before-deploy-12345}
app.jwt.expiration-ms=86400000

# ---- CORS: frontend address(es), comma separated ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- Default admin account (created on first start) ----
app.admin.email=${ADMIN_EMAIL:admin@shareshelf.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
