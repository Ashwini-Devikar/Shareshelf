spring.application.name=shareshelf-backend
server.port=8080

# ---- MySQL (CHANGE THE PASSWORD to your MySQL root password) ----
spring.datasource.url=jdbc:mysql://localhost:3306/shareshelf?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Shelf@2026

# Hibernate creates/updates the tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---- JWT ----
# Must be at least 32 characters. Change it before deploying.
app.jwt.secret=shareshelf-super-secret-key-change-this-before-deploy-12345
app.jwt.expiration-ms=86400000

# ---- CORS: frontend address ----
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---- Default admin account (created on first start) ----
app.admin.email=admin@shareshelf.com
app.admin.password=Admin@123
